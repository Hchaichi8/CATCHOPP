spring.application.name=ProjectMicroService
# If startup fails with "Port 8082 was already in use", stop the other process or pick a free port:
# server.port=8083

server.port=8079

# Local dev without Eureka / Config Server (remove or set true when 8761 / 8888 are running)
spring.cloud.config.enabled=false
eureka.client.enabled=false

spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_project_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/