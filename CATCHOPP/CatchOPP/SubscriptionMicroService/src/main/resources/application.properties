spring.application.name=SubscriptionMicroService
server.port=8083

spring.config.import=optional:configserver:

# MySQL Database - SubscriptionDB
spring.datasource.url=jdbc:mysql://localhost:3306/SubscriptionDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka (optional - disable if no Eureka server)
eureka.client.enabled=false
