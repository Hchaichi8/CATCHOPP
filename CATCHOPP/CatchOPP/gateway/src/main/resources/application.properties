spring.application.name=gateway
server.port=8079

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routes — all microservices
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://UserMicroService
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**

spring.cloud.gateway.routes[1].id=subscription-service
spring.cloud.gateway.routes[1].uri=lb://SubscriptionMicroService
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/subscriptions/**,/api/payments/**,/api/promo/**

spring.cloud.gateway.routes[2].id=skill-tests-service
spring.cloud.gateway.routes[2].uri=lb://SkillTestsMicroService
spring.cloud.gateway.routes[2].predicates[0]=Path=/SkillTests/**

spring.cloud.gateway.routes[3].id=referral-service
spring.cloud.gateway.routes[3].uri=lb://ReferralMicroService
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/referral/**,/api/wallet/**,/api/donations/**

# CORS — allow Angular frontend
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
