spring.application.name=gateway
server.port=8079

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routes — all microservices (paths match actual controller @RequestMapping)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://UserMicroService
spring.cloud.gateway.routes[0].predicates[0]=Path=/User/**
spring.cloud.gateway.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.routes[1].id=subscription-service
spring.cloud.gateway.routes[1].uri=lb://SubscriptionMicroService
spring.cloud.gateway.routes[1].predicates[0]=Path=/Subscription/**
spring.cloud.gateway.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.routes[2].id=skill-tests-service
spring.cloud.gateway.routes[2].uri=lb://SkillTestsMicroService
spring.cloud.gateway.routes[2].predicates[0]=Path=/SkillTests/**
spring.cloud.gateway.routes[2].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.routes[3].id=referral-service
spring.cloud.gateway.routes[3].uri=lb://ReferralMicroService
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/donations/**,/api/wallet/**,/Referral/**,/api/rewards/**
spring.cloud.gateway.routes[3].filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Health check routes — proxy actuator through gateway to avoid CORS
spring.cloud.gateway.routes[4].id=user-health
spring.cloud.gateway.routes[4].uri=lb://UserMicroService
spring.cloud.gateway.routes[4].predicates[0]=Path=/health/user
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/health/user,/actuator/health

spring.cloud.gateway.routes[5].id=subscription-health
spring.cloud.gateway.routes[5].uri=lb://SubscriptionMicroService
spring.cloud.gateway.routes[5].predicates[0]=Path=/health/subscription
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/health/subscription,/actuator/health

spring.cloud.gateway.routes[6].id=referral-health
spring.cloud.gateway.routes[6].uri=lb://ReferralMicroService
spring.cloud.gateway.routes[6].predicates[0]=Path=/health/referral
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/health/referral,/actuator/health

spring.cloud.gateway.routes[7].id=skilltests-health
spring.cloud.gateway.routes[7].uri=lb://SkillTestsMicroService
spring.cloud.gateway.routes[7].predicates[0]=Path=/health/skilltests
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/health/skilltests,/actuator/health

# CORS — allow Angular frontend
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
