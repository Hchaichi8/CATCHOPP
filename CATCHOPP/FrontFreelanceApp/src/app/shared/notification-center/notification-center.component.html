<div class="notification-wrapper">
  <button type="button" class="bell-btn" (click)="toggle()" aria-label="Notifications">
    <i class="fa fa-bell"></i>
    <span class="badge" *ngIf="((notif.unreadCount$ | async) ?? 0) > 0">{{ (notif.unreadCount$ | async) ?? 0 }}</span>
  </button>
  <div class="dropdown" *ngIf="open">
    <div class="dropdown-header">
      <span>Notifications</span>
      <button type="button" class="link-btn" (click)="markAllRead()">Mark all read</button>
    </div>
    <div class="list">
      <div
        *ngFor="let n of (notif.notifications$ | async) || []"
        class="item"
        [class.unread]="!n.read"
        (click)="onItemClick(n)"
      >
        <i class="fa" [ngClass]="iconClass(n.type)"></i>
        <div>
          <div class="title">{{ n.title }}</div>
          <div class="msg">{{ n.message }}</div>
          <div class="date">{{ formatDate(n.date) }}</div>
        </div>
        <button
          type="button"
          class="mark-read-inline"
          *ngIf="!n.read"
          (click)="markRead(n, $event)"
          title="Mark read"
        >
          ✓
        </button>
      </div>
      <div *ngIf="((notif.notifications$ | async)?.length ?? 0) === 0" class="empty">No notifications</div>
    </div>
    <div class="dropdown-footer">
      <a routerLink="/Notifications" class="footer-link" (click)="open = false">Open full inbox</a>
    </div>
  </div>
</div>
