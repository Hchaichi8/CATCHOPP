<div class="toast-stack">
  <div
    *ngFor="let toast of toasts; trackBy: trackById"
    class="toast"
    [class.toast-high]="toast.importance === 'high'"
    [@slideIn]
    (mouseenter)="pauseTimer(toast)"
    (mouseleave)="resumeTimer(toast)"
    (click)="navigate(toast)">

    <!-- Left accent bar -->
    <div class="toast-accent" [style.background]="getAccentColor(toast.importance)"></div>

    <!-- Icon -->
    <div class="toast-icon">{{ getIcon(toast.type) }}</div>

    <!-- Content -->
    <div class="toast-body">
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-message">{{ toast.message }}</div>
      <div class="toast-time">Just now</div>
    </div>

    <!-- Close -->
    <button class="toast-close" (click)="dismiss(toast.id); $event.stopPropagation()">
      <i class="fa fa-times"></i>
    </button>

    <!-- Progress bar -->
    <div class="toast-progress">
      <div class="toast-progress-bar"
           [style.width.%]="toast.progress"
           [style.background]="getProgressColor(toast.importance)">
      </div>
    </div>
  </div>
</div>
