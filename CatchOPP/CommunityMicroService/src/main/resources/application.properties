spring.application.name=CommunityMicroService
server.port=8090

spring.config.import=optional:configserver:

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchop_community_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka — register with service discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# JWT Configuration
# Must match the secret used in the UserMicroService that issues the tokens
jwt.secret=catchopp_super_secret_key_2024_must_be_at_least_256_bits_long_for_hs256

# Feign — UserMicroService fallback URL (used if Eureka is unavailable)
user-service.url=http://localhost:8083

# Feign logging
logging.level.tn.esprit.communitymicroservice.config.UserClient=DEBUG
